name: 已归档全市场数据补发
on:
  workflow_run:
    workflows: ['沪深主板午盘与收盘快照', '全市场午盘与收盘快照']
    types: [completed]
  schedule:
    - cron: '7 5,8,10 * * 1-5' # 北京时间13:07/16:07/18:07，不跨时段重采
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-market-delivery-recovery
  cancel-in-progress: false
jobs:
  redeliver:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 从私有归档补发并匿名核验
        env:
          PUBLIC_FEED_REPOSITORY: ${{ vars.PUBLIC_FEED_REPOSITORY }}
          PUBLIC_FEED_TOKEN: ${{ secrets.PUBLIC_FEED_TOKEN }}
        run: python -m collector.snapshot_redeliver
