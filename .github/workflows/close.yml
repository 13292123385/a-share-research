name: A股收盘采集
on:
  schedule:
    - cron: '5,20,40 7 * * 1-5' # UTC -> 北京时间15:05/15:20/15:40
  workflow_dispatch:
    inputs:
      date:
        description: '交易日 YYYY-MM-DD，留空为北京时间今天；历史接口有保留期限'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: close-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: 采集（保留失败证据）
        id: collect
        continue-on-error: true
        env:
          REQUEST_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          args=()
          if [ -n "$REQUEST_DATE" ]; then args+=(--date "$REQUEST_DATE"); fi
          python -m collector.run "${args[@]}"
      - name: 上传全部结果供诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: close-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          retention-days: 7
          if-no-files-found: warn
      - name: 显示数据完整性摘要
        if: always()
        env:
          COLLECT_SUMMARY_FILE: ${{ steps.collect.outputs.summary_path }}
        run: python -m collector.ci_summary
      - name: 校验归档结构
        id: quality
        if: always()
        run: python -m collector.validate data
      - name: 保存每日采集文件
        if: always() && steps.quality.outcome == 'success'
        run: |
          if [ ! -d data ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'data: archive close collection attempt'
            git push
          fi
      - name: 对缺失或失败亮红灯
        if: steps.collect.outcome == 'failure'
        run: exit 1
